version: "12.0"
description: Repository-specific directives for the Eliware MCP server template.
directives:
  - id: E-1040.0
    dos:
      - Provide an MCP server with tool adapters, HTTP and stdio transports, and token checks.
      - Document the tool behavior.
      - Replace template identity and package metadata in each derived server.
    donts:
      - Do not publish sample behavior as a complete MCP server.
      - Do not expose a live endpoint without access checks.
