name: Publish

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm install --global npm@12
      - run: >-
          node -e 'const {execFileSync}=require("node:child_process");const v=execFileSync("npm",["--version"],{encoding:"utf8"}).trim();if(!/^\d+\.\d+\.\d+$/.test(v)||Number(v.split(".")[0])<12)process.exit(1)'
      - run: npm ci
      - run: npm test

  publish:
    needs: validate
    environment: ghcr-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify release tag matches package version
        id: version
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] && test "$(node -p "require(process.argv[1]).version" ./package.json)" = "${GITHUB_REF_NAME#v}"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/eliware/mcp-server-template:v11.0.0
      - name: Attest published image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/eliware/mcp-server-template
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify version tag resolves to the pushed digest
        run: test "$(docker buildx imagetools inspect ghcr.io/eliware/mcp-server-template:v11.0.0 --format '{{.Manifest.Digest}}')" = "${{ steps.image.outputs.digest }}"
      - name: Inspect image by digest
        run: docker buildx imagetools inspect ghcr.io/eliware/mcp-server-template@${{ steps.image.outputs.digest }}
      - name: Verify signed image attestation
        run: gh attestation verify oci://ghcr.io/eliware/mcp-server-template@${{ steps.image.outputs.digest }} --repo ${{ github.repository }}
      - name: Record release handoff evidence
        run: 'echo "Image digest: ghcr.io/eliware/mcp-server-template@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"'
